version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka1:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [ zookeeper ]
    ports: [ "9092:9092" ]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

  kafka2:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [ zookeeper ]
    ports: [ "9093:9093" ]
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:29093,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

  kafka3:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [ zookeeper ]
    ports: [ "9094:9094" ]
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:29094,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29094,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [ kafka1, kafka2, kafka3 ]
    entrypoint: [ "bash", "-c" ]
    command:
      - |
        cub kafka-ready -b kafka1:29092,kafka2:29093,kafka3:29094 3 30 && \
        kafka-topics --create --if-not-exists --topic system-metrics --bootstrap-server kafka1:29092 --partitions 6 --replication-factor 3 && \
        kafka-topics --create --if-not-exists --topic anomalies --bootstrap-server kafka1:29092 --partitions 3 --replication-factor 3 && \
        kafka-topics --create --if-not-exists --topic chaos-commands --bootstrap-server kafka1:29092 --partitions 6 --replication-factor 3 && \
        echo topics ready


  web-01:
    build: { context: ., dockerfile: producers/Dockerfile }
    command: [ "web-01" ]
    depends_on: [ kafka-init ]
    environment:
      KAFKA_BROKER: kafka1:29092,kafka2:29093,kafka3:29094

  web-02:
    build: { context: ., dockerfile: producers/Dockerfile }
    command: [ "web-02" ]
    depends_on: [ kafka-init ]
    environment:
      KAFKA_BROKER: kafka1:29092,kafka2:29093,kafka3:29094

  db-01:
    build: { context: ., dockerfile: producers/Dockerfile }
    command: [ "db-01" ]
    depends_on: [ kafka-init ]
    environment:
      KAFKA_BROKER: kafka1:29092,kafka2:29093,kafka3:29094

  cache-01:
    build: { context: ., dockerfile: producers/Dockerfile }
    command: [ "cache-01" ]
    depends_on: [ kafka-init ]
    environment:
      KAFKA_BROKER: kafka1:29092,kafka2:29093,kafka3:29094

  worker-01:
    build: { context: ., dockerfile: producers/Dockerfile }
    command: [ "worker-01" ]
    depends_on: [ kafka-init ]
    environment:
      KAFKA_BROKER: kafka1:29092,kafka2:29093,kafka3:29094

  anomaly-detector:
    build: { context: ., dockerfile: consumers/Dockerfile }
    depends_on: [ kafka-init ]
    environment:
      KAFKA_BROKER: kafka1:29092,kafka2:29093,kafka3:29094

  api:
    build: { context: ., dockerfile: api/Dockerfile }
    depends_on: [ kafka-init ]
    ports: [ "8000:8000" ]
    volumes:
      - ./dashboard:/app/dashboard
      - ./api:/app/api
    environment:
      KAFKA_BROKER: kafka1:29092,kafka2:29093,kafka3:29094

