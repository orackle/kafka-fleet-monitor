services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [ zookeeper ]
    ports: [ "9092:9092" ]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [ kafka ]
    entrypoint: [ "bash", "-c" ]
    command:
      - |
        cub kafka-ready -b kafka:29092 1 30 && \
        kafka-topics --create --if-not-exists --topic system-metrics --bootstrap-server kafka:29092 --partitions 6 --replication-factor 1 && \
        kafka-topics --create --if-not-exists --topic anomalies --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 && \
        kafka-topics --create --if-not-exists --topic chaos-commands --bootstrap-server kafka:29092 --partitions 6 --replication-factor 1 && \
        echo topics ready

  web-01:
    build: { context: ., dockerfile: producers/Dockerfile }
    command: [ "web-01" ]
    depends_on: [ kafka-init ]
    environment:
      KAFKA_BROKER: kafka:29092

  web-02:
    build: { context: ., dockerfile: producers/Dockerfile }
    command: [ "web-02" ]
    depends_on: [ kafka-init ]
    environment:
      KAFKA_BROKER: kafka:29092

  db-01:
    build: { context: ., dockerfile: producers/Dockerfile }
    command: [ "db-01" ]
    depends_on: [ kafka-init ]
    environment:
      KAFKA_BROKER: kafka:29092

  cache-01:
    build: { context: ., dockerfile: producers/Dockerfile }
    command: [ "cache-01" ]
    depends_on: [ kafka-init ]
    environment:
      KAFKA_BROKER: kafka:29092

  worker-01:
    build: { context: ., dockerfile: producers/Dockerfile }
    command: [ "worker-01" ]
    depends_on: [ kafka-init ]
    environment:
      KAFKA_BROKER: kafka:29092

  anomaly-detector:
    build: { context: ., dockerfile: consumers/Dockerfile }
    depends_on: [ kafka-init ]
    environment:
      KAFKA_BROKER: kafka:29092

  api:
    build: { context: ., dockerfile: api/Dockerfile }
    depends_on: [ kafka-init ]
    ports: [ "8000:8000" ]
    volumes:
      - ./dashboard:/app/dashboard
      - ./api:/app/api
    environment:
      KAFKA_BROKER: kafka:29092
