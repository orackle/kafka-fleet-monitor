app = "kafka-fleet-monitor"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  KAFKA_BROKER = "localhost:9092"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[mounts]
  source = "kafka_data"
  destination = "/var/lib/kafka/data"
